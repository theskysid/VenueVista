spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/venuevista;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
